<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED MEMORY - Immersive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #880000;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        h1 {
            font-weight: 200;
            letter-spacing: 0.4em;
            margin: 0;
            font-size: 0.8rem;
            opacity: 0.3;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
    </div>

    <div id="canvas-container"></div>

    <script>
        /**
         * Chiharu Shiota Style - Immersive Journey
         * Focus: Clarity of "Thank You" and Camera Entry.
         */

        let scene, camera, renderer, particles, lines;
        const particleCount = 18000; 
        const targetPositions = [];
        const originalOffsets = []; 
        
        let state = 0; 
        let stateTimer = 0;
        // 0: Formation, 1: Stillness & Zoom In, 2: Dissolution/Fly-through, 3: Void
        const stateDurations = [7000, 5000, 8000, 4000]; 

        let thankYouPoints = [];

        window.onload = function() {
            init();
            thankYouPoints = createTextPoints("Thank You", 120, 1100);
            setNewTargets();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.FogExp2(0xffffff, 0.006);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 160; 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount; i++) {
                posArray[i*3] = (Math.random() - 0.5) * 600;
                posArray[i*3+1] = (Math.random() - 0.5) * 600;
                posArray[i*3+2] = (Math.random() - 0.5) * 600;
                targetPositions.push({x: posArray[i*3], y: posArray[i*3+1], z: posArray[i*3+2]});
                originalOffsets.push(Math.random() * Math.PI * 2);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x990000,
                size: 0.14,
                transparent: true,
                opacity: 0 
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            const lineGeometry = new THREE.BufferGeometry();
            const lineCount = 5000; 
            const linePosArray = new Float32Array(lineCount * 2 * 3);
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePosArray, 3));
            
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x990000,
                transparent: true,
                opacity: 0,
                linewidth: 1
            });

            lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);

            window.addEventListener('resize', onWindowResize, false);
        }

        function createTextPoints(text, fontSize, canvasWidth) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvasWidth;
            canvas.height = 300; 
            ctx.fillStyle = 'black';
            ctx.font = `900 ${fontSize}px "Times New Roman", serif`; // 가독성을 위해 더 굵게 설정
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvasWidth/2, 150);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const points = [];
            // 선명도를 위해 더 촘촘하게 샘플링
            for(let y = 0; y < canvas.height; y += 1) {
                for(let x = 0; x < canvas.width; x += 1) {
                    const alpha = imageData[(y * canvas.width + x) * 4 + 3];
                    if(alpha > 120) { 
                        points.push({
                            x: (x - canvasWidth/2) * 0.15,
                            y: (150 - y) * 0.15,
                            z: (Math.random() - 0.5) * 0.2 // 입체감을 살짝 부여
                        });
                    }
                }
            }
            return points;
        }

        function updateState() {
            const now = Date.now();
            if(!this.lastUpdate) this.lastUpdate = now;
            stateTimer += (now - this.lastUpdate);
            this.lastUpdate = now;

            if(stateTimer > stateDurations[state]) {
                stateTimer = 0;
                state = (state + 1) % 4;
                setNewTargets();
            }
        }

        function setNewTargets() {
            for(let i = 0; i < particleCount; i++) {
                switch(state) {
                    case 0: // Formation
                        const tIdx = i % thankYouPoints.length;
                        if (i < thankYouPoints.length * 1.5) {
                             targetPositions[i] = { x: thankYouPoints[tIdx].x, y: thankYouPoints[tIdx].y, z: thankYouPoints[tIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            const r = 200 + Math.random() * 100;
                            targetPositions[i] = { x: Math.cos(a) * r, y: Math.sin(a) * r, z: -200 - Math.random() * 100 };
                        }
                        break;
                    case 2: // Dissolution (Fly-through effect)
                        // 카메라가 뚫고 지나갈 때 입자들이 카메라 뒤로 혹은 사방으로 발산
                        const angle = Math.random() * Math.PI * 2;
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 400,
                            y: (Math.random() - 0.5) * 400,
                            z: 200 + Math.random() * 300 // 카메라 뒤쪽으로 빠르게 이동
                        };
                        break;
                    case 3: // Void
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 600,
                            y: (Math.random() - 0.5) * 600,
                            z: (Math.random() - 0.5) * 600
                        };
                        break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateState();

            const posAttr = particles.geometry.attributes.position;
            const linePosAttr = lines.geometry.attributes.position;
            const time = Date.now() * 0.0005;

            // Opacity Logic
            let currentOpacity = 0.7;
            if (state === 0) currentOpacity = 0.7 * Math.min(stateTimer / 4000, 1);
            if (state === 2) currentOpacity = 0.7 * (1 - Math.min(stateTimer / 7000, 1));
            if (state === 3) currentOpacity = 0;

            particles.material.opacity = currentOpacity;
            lines.material.opacity = currentOpacity * 0.15;

            // Camera Movement (The "Entry" Logic)
            if (state === 1) { // Stillness & Zooming In
                camera.position.z -= 0.15; // 글자 내부로 서서히 진입
            } else if (state === 2) { // Dissolving & Passing Through
                camera.position.z -= 0.4; // 더 빠르게 돌파
            } else if (state === 3) { // Resetting
                camera.position.z = 160;
            }

            for(let i = 0; i < particleCount; i++) {
                let target = targetPositions[i];
                
                const lerpSpeed = (state === 0) ? 0.05 : 0.012;
                posAttr.array[i*3] += (target.x - posAttr.array[i*3]) * lerpSpeed;
                posAttr.array[i*3+1] += (target.y - posAttr.array[i*3+1]) * lerpSpeed;
                posAttr.array[i*3+2] += (target.z - posAttr.array[i*3+2]) * lerpSpeed;

                // Subtle organic vibration
                if (state < 2) {
                    posAttr.array[i*3] += Math.sin(time + originalOffsets[i]) * 0.01;
                    posAttr.array[i*3+1] += Math.cos(time + originalOffsets[i]) * 0.01;
                }
            }
            
            posAttr.needsUpdate = true;

            // Line Update
            const lineCount = lines.geometry.attributes.position.count / 2;
            for(let i = 0; i < lineCount; i++) {
                const p1 = i * 2;
                const p2 = (i * 2 + 12) % particleCount; 
                linePosAttr.array[i * 6] = posAttr.array[p1 * 3];
                linePosAttr.array[i * 6 + 1] = posAttr.array[p1 * 3 + 1];
                linePosAttr.array[i * 6 + 2] = posAttr.array[p1 * 3 + 2];
                linePosAttr.array[i * 6 + 3] = posAttr.array[p2 * 3];
                linePosAttr.array[i * 6 + 4] = posAttr.array[p2 * 3 + 1];
                linePosAttr.array[i * 6 + 5] = posAttr.array[p2 * 3 + 2];
            }
            linePosAttr.needsUpdate = true;

            // Rotation for 3D depth
            particles.rotation.y += 0.0003;
            lines.rotation.y += 0.0003;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
