<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RED MEMORY - High Clarity & Fast Pace</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Times New Roman', serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #880000;
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        h1 {
            font-weight: 200;
            letter-spacing: 0.4em;
            margin: 0;
            font-size: 0.75rem;
            opacity: 0.3;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Red Memory</h1>
    </div>

    <div id="canvas-container"></div>

    <script>
        /**
         * Chiharu Shiota Style - Fast & Sharp Version
         * Sequence: Scattering -> Min Jae Kang -> Precise Eye -> Blink -> PORTFOLIO -> Dissolve
         */

        let scene, camera, renderer, particles, lines;
        const particleCount = 28000; 
        const targetPositions = [];
        const originalOffsets = []; 
        
        let state = 0; 
        let stateTimer = 0;
        // 진행 속도 가속 (시간 단축)
        // 0: Scattering, 1: Min Jae Kang, 2: Eye, 3: Blink, 4: PORTFOLIO, 5: Dissolve, 6: Void
        const stateDurations = [2000, 3500, 3500, 600, 3500, 4000, 2000]; 

        let namePoints = [];
        let eyePoints = [];
        let portfolioPoints = [];

        window.onload = function() {
            init();
            namePoints = createTextPoints("Min Jae Kang", 110, 1200);
            eyePoints = createPreciseEyePoints(); 
            portfolioPoints = createTextPoints("PORTFOLIO", 120, 1200);
            setNewTargets();
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.FogExp2(0xffffff, 0.006);

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 170; 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount; i++) {
                posArray[i*3] = (Math.random() - 0.5) * 600;
                posArray[i*3+1] = (Math.random() - 0.5) * 600;
                posArray[i*3+2] = (Math.random() - 0.5) * 600;
                targetPositions.push({x: posArray[i*3], y: posArray[i*3+1], z: posArray[i*3+2]});
                originalOffsets.push({
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.8 + Math.random() * 1.2,
                    amplitude: 0.03 + Math.random() * 0.07
                });
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xaa0000,
                size: 0.15,
                transparent: true,
                opacity: 0 
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            const lineGeometry = new THREE.BufferGeometry();
            const lineCount = 6000; // 가독성을 위해 선의 개수 최적화
            const linePosArray = new Float32Array(lineCount * 2 * 3);
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePosArray, 3));
            
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xaa0000,
                transparent: true,
                opacity: 0,
                linewidth: 1
            });

            lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);

            window.addEventListener('resize', onWindowResize, false);
        }

        function createPreciseEyePoints() {
            const points = [];
            const w = 75; 
            const h = 28; 
            
            // 1. 눈꺼풀 (Eyelids) - 가독성을 위해 외곽선 강조
            for (let i = 0; i < 5000; i++) {
                const t = (i / 5000) * 2 - 1;
                const x = t * w;
                const curve = Math.sqrt(1 - Math.pow(t, 2)); // 원형에 가까운 곡선
                const upperY = curve * h;
                const lowerY = -curve * h;
                const y = Math.random() > 0.5 ? upperY : lowerY;
                points.push({ x: x * 0.45, y: y * 0.45, z: 0 });
            }

            // 2. 홍채와 동공 (Iris & Pupil)
            const irisRadius = 15;
            for (let i = 0; i < 6000; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = Math.sqrt(Math.random()) * irisRadius;
                const isPupil = r < 6;
                points.push({
                    x: Math.cos(angle) * r * 0.45,
                    y: Math.sin(angle) * r * 0.45,
                    z: isPupil ? 1.5 : 0.5
                });
            }
            return points;
        }

        function createTextPoints(text, fontSize, canvasWidth) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvasWidth;
            canvas.height = 350; 
            ctx.fillStyle = 'black';
            ctx.font = `900 ${fontSize}px "Times New Roman", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvasWidth/2, 175);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const points = [];
            for(let y = 0; y < canvas.height; y += 1) {
                for(let x = 0; x < canvas.width; x += 1) {
                    const alpha = imageData[(y * canvas.width + x) * 4 + 3];
                    if(alpha > 160) { 
                        points.push({
                            x: (x - canvasWidth/2) * 0.16,
                            y: (175 - y) * 0.16,
                            z: 0 // 가독성을 위해 Z축 깊이 제거
                        });
                    }
                }
            }
            return points;
        }

        function updateState() {
            const now = Date.now();
            if(!this.lastUpdate) this.lastUpdate = now;
            stateTimer += (now - this.lastUpdate);
            this.lastUpdate = now;

            if(stateTimer > stateDurations[state]) {
                stateTimer = 0;
                state = (state + 1) % 7;
                setNewTargets();
            }
        }

        function setNewTargets() {
            for(let i = 0; i < particleCount; i++) {
                switch(state) {
                    case 0: // Scattering
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 500,
                            y: (Math.random() - 0.5) * 500,
                            z: (Math.random() - 0.5) * 300
                        };
                        break;
                    case 1: // Min Jae Kang
                        const nIdx = i % namePoints.length;
                        if (i < namePoints.length * 2.2) {
                             targetPositions[i] = { x: namePoints[nIdx].x, y: namePoints[nIdx].y, z: namePoints[nIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            targetPositions[i] = { x: Math.cos(a) * 250, y: Math.sin(a) * 250, z: -200 };
                        }
                        break;
                    case 2: // Eye
                        const eIdx = i % eyePoints.length;
                        if (i < eyePoints.length * 2.5) {
                             targetPositions[i] = { x: eyePoints[eIdx].x, y: eyePoints[eIdx].y, z: eyePoints[eIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            targetPositions[i] = { x: Math.cos(a) * 220, y: Math.sin(a) * 220, z: -150 };
                        }
                        break;
                    case 3: // Blink
                        targetPositions[i] = {
                            x: targetPositions[i].x,
                            y: targetPositions[i].y * 0.0001, 
                            z: targetPositions[i].z
                        };
                        break;
                    case 4: // PORTFOLIO
                        const pIdx = i % portfolioPoints.length;
                        if (i < portfolioPoints.length * 2.2) {
                             targetPositions[i] = { x: portfolioPoints[pIdx].x, y: portfolioPoints[pIdx].y, z: portfolioPoints[pIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            targetPositions[i] = { x: Math.cos(a) * 280, y: Math.sin(a) * 280, z: -200 };
                        }
                        break;
                    case 5: // Dissolve
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 700,
                            y: targetPositions[i].y + 500, 
                            z: targetPositions[i].z + 600
                        };
                        break;
                    case 6: // Void
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 800,
                            y: (Math.random() - 0.5) * 800,
                            z: (Math.random() - 0.5) * 800
                        };
                        break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateState();

            const posAttr = particles.geometry.attributes.position;
            const linePosAttr = lines.geometry.attributes.position;
            const time = Date.now() * 0.001;

            // 상태별 선명도 제어
            const isForming = (state === 1 || state === 2 || state === 4);
            let currentOpacity = 0.9;
            if (state === 0) currentOpacity = 0.9 * Math.min(stateTimer / 1000, 1);
            if (state === 5) currentOpacity = 0.9 * (1 - Math.min(stateTimer / 3000, 1));
            if (state === 6) currentOpacity = 0;

            particles.material.opacity = currentOpacity;
            // 텍스트 형성 중에는 실의 가독성 방해를 줄이기 위해 더 투명하게 설정
            lines.material.opacity = isForming ? currentOpacity * 0.06 : currentOpacity * 0.15;

            // 카메라 가속
            if (state === 4) camera.position.z -= 0.2; 
            if (state === 5) camera.position.z -= 1.2; 
            if (state === 6) camera.position.z = 170;

            for(let i = 0; i < particleCount; i++) {
                let target = targetPositions[i];
                const off = originalOffsets[i];
                const breathe = isForming ? 0 : Math.sin(time * off.speed + off.phase) * off.amplitude;

                // 이동 속도 가속
                const lerpSpeed = (state === 3) ? 0.45 : (isForming ? 0.12 : 0.02);
                
                posAttr.array[i*3] += (target.x + breathe - posAttr.array[i*3]) * lerpSpeed;
                posAttr.array[i*3+1] += (target.y + breathe - posAttr.array[i*3+1]) * lerpSpeed;
                posAttr.array[i*3+2] += (target.z + breathe - posAttr.array[i*3+2]) * lerpSpeed;
            }
            
            posAttr.needsUpdate = true;

            // 실의 연결 - 간격을 좁혀서(p2 = p1+3) 글자를 가로지르는 긴 실 방지
            const lineCount = lines.geometry.attributes.position.count / 2;
            for(let i = 0; i < lineCount; i++) {
                const p1 = i * 2;
                const p2 = (i * 2 + 4) % particleCount; 
                linePosAttr.array[i * 6] = posAttr.array[p1 * 3];
                linePosAttr.array[i * 6 + 1] = posAttr.array[p1 * 3 + 1];
                linePosAttr.array[i * 6 + 2] = posAttr.array[p1 * 3 + 2];
                linePosAttr.array[i * 6 + 3] = posAttr.array[p2 * 3];
                linePosAttr.array[i * 6 + 4] = posAttr.array[p2 * 3 + 1];
                linePosAttr.array[i * 6 + 5] = posAttr.array[p2 * 3 + 2];
            }
            linePosAttr.needsUpdate = true;

            const isStatic = (state === 1 || state === 2 || state === 4);
            const rSpeed = isStatic ? 0.00005 : 0.0006;
            particles.rotation.y += rSpeed;
            lines.rotation.y += rSpeed;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
