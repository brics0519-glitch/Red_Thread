<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시오타 치하루의 붉은 실 - Shiota's Red Threads</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #880000;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-weight: 200;
            letter-spacing: 0.2em;
            margin: 0;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        .status {
            font-size: 0.8rem;
            margin-top: 5px;
            opacity: 0.6;
            text-transform: uppercase;
        }
        #instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aa0000;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>RED MEMORY: HIGH PRECISION</h1>
        <div id="current-state" class="status">Initializing...</div>
    </div>

    <div id="instruction">마우스로 시점을 조절하여 실의 선명한 형상을 관찰하세요.</div>
    <div id="canvas-container"></div>

    <script>
        /**
         * Chiharu Shiota Style Thread Animation - High Clarity Version
         * Sequence: Scattering -> Clustering -> "Min Jae Kang" -> "PORTFOLIO" -> Maintaining -> Dissolving
         */

        let scene, camera, renderer, particles, lines, lineGeometry;
        const particleCount = 15000; // 입자 수를 15,000개로 대폭 증설
        const targetPositions = [];
        
        let state = 0; 
        let stateTimer = 0;
        const stateDurations = [4000, 3000, 6000, 6000, 4000, 4000]; 
        const stateNames = [
            "산개 (Scattering)", 
            "뭉침 (Clustering)", 
            "이름 형성 (Min Jae Kang)", 
            "주제 형성 (PORTFOLIO)", 
            "유지 (Maintaining)", 
            "해체 (Dissolving)"
        ];

        let namePoints = [];
        let portfolioPoints = [];

        window.onload = function() {
            init();
            // 가독성을 극대화하기 위해 캔버스 너비와 폰트 설정 조정
            namePoints = createTextPoints("Min Jae Kang", 85, 1200);
            portfolioPoints = createTextPoints("PORTFOLIO", 95, 1200);
            animate();
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);
            scene.fog = new THREE.FogExp2(0xffffff, 0.005);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 120; 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 250;
                const y = (Math.random() - 0.5) * 250;
                const z = (Math.random() - 0.5) * 250;
                posArray[i*3] = x;
                posArray[i*3+1] = y;
                posArray[i*3+2] = z;
                targetPositions.push({x, y, z});
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xaa0000,
                size: 0.18, // 선명도를 위해 입자 크기 미세 조정
                transparent: true,
                opacity: 0.9 // 더 진하게 설정
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            lineGeometry = new THREE.BufferGeometry();
            const lineCount = 4000; // 실의 밀도를 높여 예술적 효과 강화
            const linePosArray = new Float32Array(lineCount * 2 * 3);
            lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePosArray, 3));
            
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0xaa0000,
                transparent: true,
                opacity: 0.06,
                linewidth: 1
            });

            lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);

            window.addEventListener('resize', onWindowResize, false);
            
            document.addEventListener('mousemove', (e) => {
                const mouseX = (e.clientX - window.innerWidth / 2) * 0.02;
                const mouseY = (e.clientY - window.innerHeight / 2) * 0.02;
                camera.position.x += (mouseX - camera.position.x) * 0.05;
                camera.position.y += (-mouseY - camera.position.y) * 0.05;
            });
        }

        function createTextPoints(text, fontSize, canvasWidth) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvasWidth;
            canvas.height = 300; 
            
            ctx.fillStyle = 'black';
            ctx.font = `900 ${fontSize}px "serif", "Times New Roman"`; // 900 가중치로 더 두껍게
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvasWidth/2, 150);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const points = [];
            
            // step을 1로 설정하여 모든 유효한 픽셀을 추출 (최고 정밀도)
            const step = 1;
            for(let y = 0; y < canvas.height; y += step) {
                for(let x = 0; x < canvas.width; x += step) {
                    const alpha = imageData[(y * canvas.width + x) * 4 + 3];
                    if(alpha > 160) { // 임계값을 높여 외곽선을 더 날카롭게 추출
                        points.push({
                            x: (x - canvasWidth/2) * 0.15, // 약간 더 작게 만들어 화면 내 안착
                            y: (150 - y) * 0.15,
                            z: (Math.random() - 0.5) * 0.1 // Z-깊이를 거의 0에 가깝게 하여 선명도 극대화
                        });
                    }
                }
            }
            return points;
        }

        function updateState() {
            const now = Date.now();
            if(!this.lastUpdate) this.lastUpdate = now;
            
            stateTimer += (now - this.lastUpdate);
            this.lastUpdate = now;

            if(stateTimer > stateDurations[state]) {
                stateTimer = 0;
                state = (state + 1) % 6;
                document.getElementById('current-state').innerText = stateNames[state];
                setNewTargets();
            }
        }

        function setNewTargets() {
            for(let i = 0; i < particleCount; i++) {
                switch(state) {
                    case 0: // Scatter
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 250,
                            y: (Math.random() - 0.5) * 250,
                            z: (Math.random() - 0.5) * 250
                        };
                        break;
                    case 1: // Cluster
                        const angle = Math.random() * Math.PI * 2;
                        const radius = Math.random() * 35;
                        targetPositions[i] = {
                            x: Math.cos(angle) * radius,
                            y: Math.sin(angle) * radius,
                            z: (Math.random() - 0.5) * 30
                        };
                        break;
                    case 2: // "Min Jae Kang"
                        const nIdx = i % namePoints.length;
                        if (i < namePoints.length * 1.8) { // 밀도를 위해 입자를 중첩해서 채움
                             targetPositions[i] = { x: namePoints[nIdx].x, y: namePoints[nIdx].y, z: namePoints[nIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            const r = 80 + Math.random() * 60;
                            targetPositions[i] = { x: Math.cos(a) * r, y: Math.sin(a) * r, z: -60 - Math.random() * 60 };
                        }
                        break;
                    case 3: // "PORTFOLIO"
                        const pIdx = i % portfolioPoints.length;
                        if (i < portfolioPoints.length * 1.8) {
                            targetPositions[i] = { x: portfolioPoints[pIdx].x, y: portfolioPoints[pIdx].y, z: portfolioPoints[pIdx].z };
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            const r = 90 + Math.random() * 70;
                            targetPositions[i] = { x: Math.cos(a) * r, y: Math.sin(a) * r, z: -60 - Math.random() * 60 };
                        }
                        break;
                    case 4: // Maintain
                        break;
                    case 5: // Dissolve
                        targetPositions[i] = {
                            x: (Math.random() - 0.5) * 350,
                            y: (Math.random() - 0.5) * 350,
                            z: (Math.random() - 0.5) * 350
                        };
                        break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updateState();

            const posAttr = particles.geometry.attributes.position;
            const linePosAttr = lines.geometry.attributes.position;
            
            for(let i = 0; i < particleCount; i++) {
                let target = targetPositions[i];
                
                // 유지 상태일 때 미세한 흔들림 최소화 (선명도 유지)
                if(state === 4) {
                    target.x += Math.sin(Date.now() * 0.001 + i) * 0.003;
                    target.y += Math.cos(Date.now() * 0.001 + i) * 0.003;
                }

                // 텍스트 상태일 때 더 민감하고 빠르게 이동
                const lerpSpeed = (state === 2 || state === 3) ? 0.09 : 0.04;
                posAttr.array[i*3] += (target.x - posAttr.array[i*3]) * lerpSpeed;
                posAttr.array[i*3+1] += (target.y - posAttr.array[i*3+1]) * lerpSpeed;
                posAttr.array[i*3+2] += (target.z - posAttr.array[i*3+2]) * lerpSpeed;
            }
            
            posAttr.needsUpdate = true;

            const lineCount = lines.geometry.attributes.position.count / 2;
            for(let i = 0; i < lineCount; i++) {
                const p1Index = i * 2;
                const p2Index = (i * 2 + 10) % particleCount; 
                
                linePosAttr.array[i * 6] = posAttr.array[p1Index * 3];
                linePosAttr.array[i * 6 + 1] = posAttr.array[p1Index * 3 + 1];
                linePosAttr.array[i * 6 + 2] = posAttr.array[p1Index * 3 + 2];
                
                linePosAttr.array[i * 6 + 3] = posAttr.array[p2Index * 3];
                linePosAttr.array[i * 6 + 4] = posAttr.array[p2Index * 3 + 1];
                linePosAttr.array[i * 6 + 5] = posAttr.array[p2Index * 3 + 2];
            }
            linePosAttr.needsUpdate = true;

            // 텍스트 감상 시 회전을 거의 멈춤으로써 가독성 극대화
            const rotationSpeed = (state === 2 || state === 3) ? 0.00005 : 0.0008;
            particles.rotation.y += rotationSpeed;
            lines.rotation.y += rotationSpeed;

            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
